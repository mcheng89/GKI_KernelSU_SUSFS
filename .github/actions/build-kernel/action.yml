name: 'Build Kernel'
description: 'Builds kernel using legacy build.sh or Bazel (kleaf)'
inputs:
  version:
    description: 'Kernel config version (e.g., android14-6.1)'
    required: true
  page_size:
    description: 'ARM64 page size: 4k (default, unchanged behaviour) or 16k'
    required: false
    type: string
    default: '4k'
  allow_version_mismatch:
    description: 'Whether to force-load version-mismatched modules'
    required: false
    type: boolean
    default: false
runs:
  using: composite
  steps:
    - name: Setup Kernel Configs
      if: false
      uses: ./.github/actions/set-kernel-config

    # - name: Provide host ld from repo prebuilts
    #   shell: bash
    #   run: |
    #     cd "${{ github.workspace }}/kernel"
    #     # build.sh REPLACES PATH with 4 repo dirs (build-tools/path,
    #     # prebuilt clang bin, prebuilts/gas, out/host_tools), so /usr/bin and
    #     # /usr/local/bin are invisible: apt binutils can NOT fix this. Instead,
    #     # symlink ld.lld as "ld" inside the prebuilt clang's own bin dir -- the
    #     # clang driver looks there first, no PATH needed.
    #     # Dynamic, not hardcoded: resolve CLANG_PREBUILT_BIN exactly the way
    #     # build.sh does -- source build.config.constants (CLANG_VERSION) then
    #     # the same BUILD_CONFIG the build uses (build.config.gki.aarch64 chain).
    #     # ("|| true": runner shell is -e -o pipefail; failures here must fall
    #     # through to the loud error below, not kill the step silently.)
    #     CLANG_BIN=""
    #     if [ -f "common/build.config.gki.aarch64" ]; then
    #       CLANG_BIN=$(ROOT_DIR="$PWD" KERNEL_DIR=common bash -c '[ -f common/build.config.constants ] && . common/build.config.constants; . common/build.config.gki.aarch64; echo "$CLANG_PREBUILT_BIN"' || true)
    #     fi
    #     if [ -n "$CLANG_BIN" ] && [ -d "$CLANG_BIN" ] && [ -f "$CLANG_BIN/ld.lld" ]; then
    #       echo "Build clang bin (from build.config chain): $CLANG_BIN"
    #       ln -sf "ld.lld" "$CLANG_BIN/ld"
    #       ls -la "$CLANG_BIN/ld"
    #     else
    #       echo "ERROR: could not resolve build clang (got: '$CLANG_BIN')" >&2
    #       echo "--- workspace/kernel:" >&2
    #       ls "${{ github.workspace }}/kernel"
    #       exit 1
    #     fi

    - name: 'Build Kernel'
      shell: bash
      working-directory: ${{ github.workspace }}/kernel
      run: |
        PAGE_SIZE="${{ inputs.page_size }}"
        sed -i 's/check_defconfig//' ./common/build.config.gki
        if [ -f "build/build.sh" ]; then
          if [ "$PAGE_SIZE" != "4k" ]; then
            echo "ERROR: page_size=${PAGE_SIZE} is only supported by the Kleaf (Bazel) build; this tree uses build/build.sh." >&2
            exit 1
          fi
          BUILD_GKI_ARTIFACTS="" \
          BUILD_GKI_CERTIFICATION_TOOLS=0 \
          BUILD_SYSTEM_DLKM=0 \
          SKIP_VENDOR_BOOT=1 \
          SKIP_EXT_MODULES=1 \
          SKIP_CP_KERNEL_HDR=1 \
          OUT_DIR="/home/runner/out" \
          LTO=thin \
          BUILD_CONFIG=common/build.config.gki.aarch64 \
          CC="/usr/bin/ccache clang" \
          CXX="/usr/bin/ccache clang++" \
          HOSTCC="/usr/bin/ccache clang" \
          HOSTCXX="/usr/bin/ccache clang++" \
          build/build.sh -j"$(nproc)"
        else
          sed -i '/name = "kernel_aarch64",/a\    check_defconfig = "disabled",' common/BUILD.bazel
          PAGE_SIZE_FLAGS=()
          if [ "$PAGE_SIZE" = "16k" ]; then
            PAGE_SIZE_FLAGS+=(--page_size=16k)
          fi
          tools/bazel build \
            --config=fast \
            "${PAGE_SIZE_FLAGS[@]}" \
            --disk_cache=/home/runner/.cache/bazel \
            //common:kernel_aarch64/Image
        fi

    - name: 'Verify Page Size in Generated .config'
      shell: bash
      working-directory: ${{ github.workspace }}/kernel
      run: |
        set -euo pipefail
        PAGE_SIZE="${{ inputs.page_size }}"

        # Kleaf writes the resolved .config under the kernel_config rule output
        # dir; the legacy build.sh writes it into OUT_DIR. Locate it instead of
        # hardcoding a path that upstream may rename.
        CONFIG_FILE=""
        for candidate in \
          bazel-bin/common/kernel_aarch64_config/out_dir/.config \
          /home/runner/out/.config; do
          if [ -f "$candidate" ]; then CONFIG_FILE="$candidate"; break; fi
        done
        if [ -z "$CONFIG_FILE" ]; then
          CONFIG_FILE="$(find bazel-bin/common /home/runner/out -maxdepth 4 -name .config -type f 2>/dev/null | head -n1 || true)"
        fi
        if [ -z "$CONFIG_FILE" ]; then
          if [ "$PAGE_SIZE" != "16k" ]; then
            # 4k builds are unchanged from before this feature; a missing .config
            # is a gap in the check, not a reason to fail a working build.
            echo "WARNING: no .config found; skipping page-size verification for 4k."
            exit 0
          fi
          echo "ERROR: could not locate the generated .config; page size cannot be verified." >&2
          exit 1
        fi
        echo "Verifying page size using $CONFIG_FILE"
        grep -E '^(# )?CONFIG_ARM64_(4K|16K|64K)_PAGES|^CONFIG_ARM64_PAGE_SHIFT' "$CONFIG_FILE" || true

        if [ "$PAGE_SIZE" = "16k" ]; then
          want_on="CONFIG_ARM64_16K_PAGES=y"
          want_off="# CONFIG_ARM64_4K_PAGES is not set"
        else
          want_on="CONFIG_ARM64_4K_PAGES=y"
          want_off="# CONFIG_ARM64_16K_PAGES is not set"
        fi

        if ! grep -qx "$want_on" "$CONFIG_FILE"; then
          echo "ERROR: expected '$want_on' in $CONFIG_FILE" >&2
          grep -E '^(# )?CONFIG_ARM64_(4K|16K|64K)_PAGES' "$CONFIG_FILE" >&2 || true
          exit 1
        fi
        if ! grep -qx "$want_off" "$CONFIG_FILE"; then
          echo "ERROR: expected '$want_off' in $CONFIG_FILE" >&2
          grep -E '^(# )?CONFIG_ARM64_(4K|16K|64K)_PAGES' "$CONFIG_FILE" >&2 || true
          exit 1
        fi
        echo "Page size verified: ${PAGE_SIZE}"

    - name: 'Gather Build Artifacts'
      shell: bash
      working-directory: ${{ github.workspace }}/kernel
      run: |
        set -euo pipefail
        if [ -f "bazel-bin/common/kernel_aarch64/Image" ]; then
          echo "Found Image at bazel-bin/common/kernel_aarch64/Image"
          cp "bazel-bin/common/kernel_aarch64/Image" "${{ github.workspace }}/AnyKernel3/Image"
          exit 0
        fi
        if [ -f "/home/runner/out/dist/Image" ]; then
          echo "Found Image at /home/runner/out/dist/Image"
          cp "/home/runner/out/dist/Image" "${{ github.workspace }}/AnyKernel3/Image"
          exit 0
        fi

        exit 1

    - name: 'Create Bootimgs Folder and Copy Images for Android 14/15/16'
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        set -euo pipefail
        # Determine build mode name based on bypass input
        if [[ "${{ inputs.bypass }}" == "true" ]]; then
          MODE="Bypass"
        else
          MODE="Normal"
        fi
        ANDROID_PART="$(echo "${{ inputs.version }}" | cut -d- -f1)"
        if [[ "$ANDROID_PART" != "android14" && "$ANDROID_PART" != "android15" && "$ANDROID_PART" != "android16" ]]; then
          echo "Not android14/15/16; skipping bootimgs creation."
          exit 0
        fi
        mkdir -p "${{ github.workspace }}/bootimgs-${MODE}"
        SRC_IMG=""
        for candidate in \
          "${{ github.workspace }}/kernel/bazel-bin/common/kernel_aarch64/Image" \
          "${{ github.workspace }}/bazel-bin/common/kernel_aarch64/Image" \
          "/home/runner/out/dist/Image" \
          "/home/runner/out/Image"; do
          if [ -f "$candidate" ]; then
            SRC_IMG="$candidate"
            break
          fi
        done
        if [ -z "$SRC_IMG" ]; then
          echo "ERROR: No Image found for bootimgs creation (${MODE}); cannot continue." >&2
          exit 1
        fi
        echo "Using Image source: $SRC_IMG"
        cp "$SRC_IMG" "${{ github.workspace }}/bootimgs-${MODE}/Image"
        cp "$SRC_IMG" "${{ github.workspace }}/bootimgs-${MODE}/${MODE}-Image"
        cp "${SRC_IMG}.lz4" "${{ github.workspace }}/bootimgs-${MODE}/Image.lz4"
        cp "${SRC_IMG}.lz4" "${{ github.workspace }}/bootimgs-${MODE}/${MODE}-Image.lz4"
        # Generate gzip for workspace Image
        gzip -n -k -f -9 "${{ github.workspace }}/bootimgs-${MODE}/Image" > "${{ github.workspace }}/bootimgs-${MODE}/Image.gz"
        gzip -n -k -f -9 "${{ github.workspace }}/bootimgs-${MODE}/${MODE}-Image" > "${{ github.workspace }}/bootimgs-${MODE}/${MODE}-Image.gz"

    - name: 'Android 13/14/15/16 boot image build script'
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        set -euo pipefail
        # Determine mode (Normal/Bypass)
        if [[ "${{ inputs.bypass }}" == "true" ]]; then
          MODE="Bypass"
        else
          MODE="Normal"
        fi
        ANDROID_PART="$(echo "${{ inputs.version }}" | cut -d- -f1)"
        if [[ "$ANDROID_PART" != "android13" && "$ANDROID_PART" != "android14" && "$ANDROID_PART" != "android15" && "$ANDROID_PART" != "android16" ]]; then
          echo "Not android13/14/15/16; skipping boot image creation."
          exit 0
        fi
        # Require `BOOT_SIGN_KEY_PATH` to be set to a filesystem path by download-kernel
        if [ -z "${BOOT_SIGN_KEY_PATH:-}" ] || [ ! -f "$BOOT_SIGN_KEY_PATH" ]; then
          echo "ERROR: BOOT_SIGN_KEY_PATH not set or not a file; cannot sign boot image for $MODE" >&2
          exit 1
        fi
        if [ ! -d "${{ github.workspace }}/bootimgs-${MODE}" ]; then
          echo "bootimgs-${MODE} not found; cannot build boot.img" >&2
          exit 1
        fi
        MKBOOTIMG_PATH="${MKBOOTIMG:-$(command -v mkbootimg 2>/dev/null || true)}"
        AVBTOOL_PATH="${AVBTOOL:-$(command -v avbtool 2>/dev/null || true)}"
        if [ -z "$MKBOOTIMG_PATH" ]; then
          echo "ERROR: mkbootimg not found; cannot create boot image for $MODE" >&2
          exit 1
        fi
        if [ -z "$AVBTOOL_PATH" ]; then
          echo "ERROR: avbtool not found; cannot sign boot image for $MODE" >&2
          exit 1
        fi
        pushd "${{ github.workspace }}/bootimgs-${MODE}" >/dev/null
        "$MKBOOTIMG_PATH" --header_version 4 --kernel Image --output boot.img
        "$AVBTOOL_PATH" add_hash_footer \
          --partition_name boot \
          --partition_size $((64 * 1024 * 1024)) \
          --image boot.img \
          --algorithm SHA256_RSA2048 \
          --key "$BOOT_SIGN_KEY_PATH"
        cp ./boot.img ./${MODE}-boot.img
        popd >/dev/null